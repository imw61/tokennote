[package]
name = "tokennote"
version = "0.3.5"
description = "Token relay balance monitor"
authors = ["TokenNote"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "tokennote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-store = "2.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.4.0"
machine-uid = "0.6"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-autostart = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints.rust]
unexpected_cfgs = "allow"
