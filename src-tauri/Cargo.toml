[package]
name = "tokennote"
version = "0.3.22"
description = "Token relay balance monitor"
authors = ["TokenNote"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "tokennote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.4", features = ["image-png", "macos-private-api"] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-store = "2.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.4.0"

# 桌面端独占依赖：托盘菜单、系统启动、单实例、机器码，以及 macOS 私有 API。
# Android 上这些 crate 要么不可用、要么没有意义、或者会被 tauri.conf 拒绝，
# 统一通过 target 限定隔离掉，让 `npm run tauri android build` 不会拉到不兼容的依赖。
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2.9.4", features = ["tray-icon"] }
machine-uid = "0.6"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-autostart = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Android 桥接：从 Rust 侧调用 Kotlin 实现的前台 Service / 通知 / Android ID 等。
# Kotlin 侧 `NativeBridge.init` 会主动把 JavaVM + Activity 注入给 Rust，
# 不再依赖 `ndk-context`（Tauri 2.11+ 不再保证它在 Activity 创建时被自动初始化）。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints.rust]
unexpected_cfgs = "allow"
